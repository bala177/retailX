# Render Blueprint - RetailX Multi-Tenant E-Commerce Platform
# Deploy with: https://render.com/deploy

services:
  # ============================================
  # BACKEND API (Node.js Web Service)
  # ============================================
  - type: web
    name: retailx-api
    runtime: node
    region: oregon # Change to your preferred region
    plan: free # Options: free, starter ($7/mo), standard ($25/mo)
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://retailx-admin.onrender.com,https://retailx-storefront.onrender.com
      - key: API_VERSION
        value: v1

  # ============================================
  # ADMIN DASHBOARD (Static Site)
  # ============================================
  - type: web
    name: retailx-admin
    runtime: static
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://retailx-api.onrender.com/api/v1

  # ============================================
  # CUSTOMER STOREFRONT (Static Site)
  # ============================================
  - type: web
    name: retailx-storefront
    runtime: static
    rootDir: storefront
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://retailx-api.onrender.com/api/v1
